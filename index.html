<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trisac</title>
<meta name="description" content="Registro delle sconfitte e delle vittorie a trisac, con le carte trentine.">
<meta name="theme-color" content="#101c5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trisac">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: la scatola Dal Negro come pannello blu con doppio filetto giallo, carte bianche come giocatori, nastro giallo d'angolo. */
:root{
  --room:#eef1f6; --room-fg:#14214f; --room-mute:#5b6690;
  --navy:#17297f; --navy-deep:#101c5c; --yellow:#f3c21c; --red:#d6443a; --blue:#2f86c0;
  --card:#fdfcf8; --ink:#1a1d33; --ink-mute:#6a6f8a; --gold:#e2a928;
  --display:'Jost','Futura','Trebuchet MS',sans-serif;
  --accent-serif:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--room:#0a1030;--room-fg:#e9ecfa;--room-mute:#97a0cc;--navy:#1c31a0;--navy-deep:#13216f;color-scheme:dark}}
:root[data-theme="dark"]{--room:#0a1030;--room-fg:#e9ecfa;--room-mute:#97a0cc;--navy:#1c31a0;--navy-deep:#13216f;color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--room);color:var(--room-fg);font-family:var(--display);padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.box{max-width:1040px;margin:0 auto;position:relative;background:var(--navy);border-radius:4px;padding:26px;box-shadow:0 1px 0 #fff3 inset,0 24px 50px -20px #0007;overflow:hidden}
/* doppio filetto giallo: uno spesso, uno sottile */
.frame{border:5px solid var(--yellow);outline:1.5px solid var(--yellow);outline-offset:-13px;padding:30px 22px 26px;position:relative;min-width:0}
.ribbon{position:absolute;top:0;right:0;width:150px;height:150px;overflow:hidden;pointer-events:none;z-index:2}
.ribbon span{position:absolute;top:30px;right:-44px;width:190px;text-align:center;transform:rotate(45deg);background:var(--yellow);color:var(--red);font-weight:700;letter-spacing:.2em;font-size:12px;padding:6px 0}

header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;color:#fff;padding-bottom:26px}
.crest{width:64px;height:auto}
.brand{font-weight:500;font-size:clamp(34px,7vw,56px);letter-spacing:.06em;line-height:1;margin:6px 0 0}
.sub{font-weight:500;letter-spacing:.26em;font-size:12px;text-transform:uppercase;color:#cfd6ff}
.motto{font-family:var(--accent-serif);font-style:italic;color:var(--yellow);font-size:17px;margin:4px 0 0}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.player{background:var(--card);color:var(--ink);border-radius:12px;border:1.5px solid #111;box-shadow:0 0 0 4px var(--card),0 8px 18px -6px #0008;margin:4px;padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;min-width:0;position:relative}
.player.worst{box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--red),0 10px 22px -6px #0009}
.tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;border-radius:99px;white-space:nowrap;z-index:1}
.orn{width:100%;max-width:130px;height:auto;display:block}
.orn.flip{transform:scaleY(-1)}
.medal{width:100%;max-width:132px;height:auto;display:block;margin:-6px 0}
.name{font-weight:600;font-size:19px;letter-spacing:.04em;margin:8px 0 0;text-align:center;overflow-wrap:anywhere}
.losses{font-weight:600;font-size:64px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums;margin-top:4px}
.lab{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-mute);font-weight:600}
.wins{margin:8px 0 10px;font-size:13px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.wins b{color:var(--navy);font-size:17px;font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.btn{border:1.5px solid var(--navy);background:var(--navy);color:#fff;border-radius:7px;padding:9px 4px;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;transition:transform .12s,background .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.lose{background:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent;color:var(--navy)}

.lower{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;margin-top:34px}
.panel{background:#ffffff12;border:1px solid #ffffff30;border-radius:10px;padding:18px;color:#fff;min-width:0}
.panel h2{margin:0 0 14px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--yellow);font-weight:600}
.row{display:grid;grid-template-columns:70px 1fr 28px;align-items:center;gap:10px;font-size:14px;margin-bottom:10px}
.bar{height:12px;background:#ffffff1c;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:repeating-linear-gradient(90deg,var(--red) 0 10px,var(--yellow) 10px 20px,var(--blue) 20px 30px);transition:width .4s}
.row output{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;max-height:210px;overflow:auto}
.log li{display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed #ffffff30;padding-bottom:7px}
.log time{color:#aab3e6;font-size:12px;font-variant-numeric:tabular-nums;min-width:58px}
.log .l{color:#ff9a90;font-weight:600}.log .w{color:#9fe0a8;font-weight:600}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:22px;color:#aab3e6;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.foot button{background:none;border:0;color:var(--yellow);font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-decoration:underline;padding:0}
.note{max-width:1040px;margin:14px auto 0;color:var(--room-mute);font-size:13px}
@media(max-width:760px){.lower{grid-template-columns:1fr}.box{padding:12px}.frame{padding:26px 12px 20px}.ribbon{width:120px;height:120px}.ribbon span{top:22px;right:-48px;font-size:10px}}
/* conferme */
.banner[hidden],.modal[hidden]{display:none}
.btn.win{background:var(--navy);border-color:var(--navy)}
.banner{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 22px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--navy-deep);color:#fff;border-top:4px solid var(--yellow);box-shadow:0 -12px 30px -10px #000a;animation:up .18s ease-out}
.banner p{margin:0;font-weight:500;font-size:16px;letter-spacing:.02em;min-width:0}
.b-btns{display:flex;gap:8px}
.b-btns .btn{padding:11px 18px;min-width:110px;font-size:13px}
.b-btns .btn.ghost{color:#fff;border-color:#ffffff80}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:#050a26d9}
.m-card{width:min(420px,100%);background:var(--card);color:var(--ink);border:1.5px solid #111;border-radius:12px;box-shadow:0 0 0 5px var(--card),0 0 0 8px var(--red),0 24px 50px -10px #000;padding:24px 22px 20px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:stretch;margin:8px}
.m-icon{align-self:center;width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:28px;display:grid;place-items:center}
.m-card h2{margin:4px 0 0;font-size:24px;letter-spacing:.04em;font-weight:600;color:var(--red)}
.m-card p{margin:0;font-size:15px;line-height:1.4}
.m-warn{color:var(--ink-mute)}
.hold{--p:0%;position:relative;overflow:hidden;margin-top:8px;border:2px solid var(--red);background:#fff;color:var(--red);border-radius:8px;padding:16px 10px;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none}
.hold::before{content:"";position:absolute;inset:0;width:var(--p);background:#f3b8b1}
.hold span{position:relative;mix-blend-mode:normal}
.m-card .btn.ghost{padding:12px}
/* smartphone: cinque righe grandi, tutte nella prima schermata */
@media(max-width:560px){
  body{padding-block:10px}
  .box{padding:8px}
  .frame{padding:12px 10px;outline-offset:-9px;border-width:4px}
  .ribbon{width:84px;height:84px}.ribbon span{top:13px;right:-40px;width:128px;font-size:8px;padding:3px 0}
  header{flex-direction:row;justify-content:flex-start;text-align:left;gap:12px;padding-bottom:12px}
  header .crest{width:38px;flex:none}
  .brand{font-size:30px;margin:0}
  .sub{display:none}
  .board{grid-template-columns:1fr;grid-auto-rows:1fr;gap:8px;height:calc(100svh - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:460px}
  .player{display:grid;grid-template-columns:auto minmax(0,1fr) auto 92px;grid-template-areas:"m n l b" "m w l b";align-content:center;align-items:center;column-gap:8px;row-gap:2px;padding:6px 10px;margin:3px;border-radius:10px;min-height:0;box-shadow:0 0 0 3px var(--card),0 4px 10px -4px #0008}
  .player.worst{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--red),0 4px 10px -4px #0008}
  .orn,.lab{display:none}
  .medal{grid-area:m;height:100%;max-height:108px;width:auto;max-width:none;margin:0}
  .name{grid-area:n;margin:0;font-size:19px;align-self:end;text-align:left;white-space:nowrap;overflow-wrap:normal;letter-spacing:.02em}
  .wins{grid-area:w;margin:0;font-size:13px;align-self:start}
  .wins b{font-size:16px}
  .losses{grid-area:l;font-size:44px;margin:0;min-width:40px;text-align:center}
  .btns{grid-area:b;grid-template-columns:1fr;gap:5px}
  .btn{padding:9px 2px;font-size:12px}
  .tag{top:-9px;left:auto;right:10px;transform:none;font-size:8px;padding:2px 7px}
  .b-btns{width:100%}.b-btns .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <text x="19" y="66" fill="#111">♠</text><text x="45" y="66" fill="#d6443a">♦</text>
    </g>
  </symbol>
</svg>

<main class="box">
  <div class="ribbon" aria-hidden="true"><span>SCONFITTE</span></div>
  <div class="frame">
    <header>
      <svg class="crest" viewBox="0 0 64 80" aria-hidden="true"><use href="#crest"/></svg>
      <h1 class="brand">TRISAC</h1>
      <div class="sub">Registro delle sconfitte · Carte trentine</div>
    </header>

    <section class="board" id="board" aria-label="Giocatori"></section>

    <div class="lower">
      <section class="panel" aria-labelledby="h-rank">
        <h2 id="h-rank">Classifica sconfitte</h2>
        <div id="rank"></div>
      </section>
      <section class="panel" aria-labelledby="h-log">
        <h2 id="h-log">Ultime mani</h2>
        <ul class="log" id="log"></ul>
      </section>
    </div>

    <div class="foot"><span>Carte trentine · 5 giocatori</span><span><button id="undo" type="button">Annulla ultima</button> &nbsp;·&nbsp; <button id="reset" type="button">Azzera</button></span></div>
  </div>
</main>
<div class="banner" id="banner" role="alertdialog" aria-live="assertive" aria-labelledby="b-text" hidden>
  <p id="b-text"></p>
  <div class="b-btns"><button class="btn ghost" id="b-no" type="button">Annulla</button><button class="btn lose" id="b-ok" type="button">Conferma</button></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" hidden>
  <div class="m-card">
    <div class="m-icon" aria-hidden="true">!</div>
    <h2 id="m-title">Azzerare tutto?</h2>
    <p id="m-sum"></p>
    <p class="m-warn">Questa azione cancella i conteggi di tutti e cinque. Subito dopo potrai ripristinarli, ma solo per pochi secondi.</p>
    <button class="hold" id="hold" type="button"><span>Tieni premuto per azzerare</span></button>
    <button class="btn ghost" id="m-no" type="button">Annulla, non toccare nulla</button>
  </div>
</div>

const HEADY={Chef:63};
const HAS_CROWN=['Lollo','Bene','Chef','Carlo','Rolly'];
const CROWN='<g stroke="#6b4a08" stroke-width="1" stroke-linejoin="round"><path d="M38 27L35 6l13 10 12-14 12 14 13-10-3 21z" fill="#f3c21c"/><rect x="38" y="27" width="44" height="7" rx="1.5" fill="#e2a928"/></g><circle cx="35" cy="6" r="3" fill="#d6443a" stroke="#6b1b15" stroke-width=".6"/><circle cx="60" cy="2" r="3.4" fill="#2f86c0" stroke="#17406a" stroke-width=".6"/><circle cx="85" cy="6" r="3" fill="#d6443a" stroke="#6b1b15" stroke-width=".6"/><circle cx="49" cy="30.5" r="1.8" fill="#d6443a"/><circle cx="60" cy="30.5" r="1.8" fill="#2f86c0"/><circle cx="71" cy="30.5" r="1.8" fill="#d6443a"/>';
function medal(initial,name){
  const photo=PHOTOS[name];
  if(photo){
    const cols=['#d6443a','#f3c21c','#2f86c0'];let beads='';
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2;beads+=`<circle cx="${60+47*Math.cos(a)}" cy="${75+60*Math.sin(a)}" r="6.4" fill="${cols[i%3]}" stroke="#222" stroke-width=".7"/>`}
    return `<svg class="medal" viewBox="0 0 120 150" role="img" aria-label="${name}"><defs><clipPath id="clip-${name}"><ellipse cx="60" cy="75" rx="40.5" ry="52.5"/><rect x="0" y="0" width="120" height="75"/></clipPath></defs><ellipse cx="60" cy="75" rx="52" ry="66" fill="#fff" stroke="#222" stroke-width=".8"/>${beads}<ellipse cx="60" cy="75" rx="41" ry="53" fill="#f4ecd6" stroke="#222" stroke-width=".8"/><g clip-path="url(#clip-${name})"><image href="${photo}" x="21" y="23" width="78" height="104" preserveAspectRatio="xMidYMid slice"/>${HAS_CROWN.includes(name)?'':`<g transform="translate(60 ${HEADY[name]||62}) scale(.85) translate(-60 -34)">${CROWN}</g>`}</g><ellipse cx="60" cy="75" rx="40.5" ry="52.5" fill="none" stroke="#222" stroke-width=".8"/></svg>`;
  }
  const cols=['#d6443a','#f3c21c','#2f86c0'];let beads='';
  const N=24;
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2;beads+=`<circle cx="${60+47*Math.cos(a)}" cy="${75+60*Math.sin(a)}" r="6.4" fill="${cols[i%3]}" stroke="#222" stroke-width=".7"/>`}
  return `<svg class="medal" viewBox="0 0 120 150" aria-hidden="true"><ellipse cx="60" cy="75" rx="52" ry="66" fill="#fff" stroke="#222" stroke-width=".8"/>${beads}<ellipse cx="60" cy="75" rx="36" ry="48" fill="#f4ecd6" stroke="#222" stroke-width=".8"/><circle cx="60" cy="62" r="13" fill="#e9c78f" stroke="#222" stroke-width=".7"/><path d="M33 112c4-22 18-28 27-28s23 6 27 28c-14 8-40 8-54 0z" fill="#2f86c0" stroke="#222" stroke-width=".8"/><path d="M45 100h30l-3 14H48z" fill="#d6443a"/><text x="60" y="70" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="17" fill="#17297f">${initial}</text><g transform="translate(60 53) scale(.62) translate(-60 -34)">${CROWN}</g></svg>`;
}
function render(){
  const max=Math.max(...S.p.map(p=>p.l));
  const board=document.getElementById('board');
  board.innerHTML=S.p.map((p,i)=>`
    <article class="player ${p.l===max&&max>0?'worst':''}">
      ${p.l===max&&max>0?'<span class="tag">Maglia nera</span>':''}
      <svg class="orn" viewBox="0 0 120 50" aria-hidden="true"><use href="#leaf"/></svg>
      ${medal(p.n[0],p.n)}
      <svg class="orn flip" viewBox="0 0 120 50" aria-hidden="true"><use href="#leaf"/></svg>
      <h3 class="name">${p.n}</h3>
      <div class="losses" aria-label="${p.l} sconfitte">${p.l}</div>
      <div class="lab">sconfitte</div>
      <div class="wins"><b>${p.w}</b> vittorie</div>
      <div class="btns">
        <button class="btn lose" data-i="${i}" data-k="l" type="button">+ Persa</button>
        <button class="btn ghost" data-i="${i}" data-k="w" type="button">+ Vinta</button>
      </div>
    </article>`).join('');
  document.getElementById('rank').innerHTML=[...S.p].sort((a,b)=>b.l-a.l).map(p=>`<div class="row"><span>${p.n}</span><div class="bar"><i style="width:${max?p.l/max*100:0}%"></i></div><output>${p.l}</output></div>`).join('');
  document.getElementById('log').innerHTML=!S.log.length?'<li>Nessuna mano ancora. Tocca "+ Persa" o "+ Vinta" su un giocatore.</li>':S.log.slice(0,8).map(([n,k,t])=>`<li><time>${t}</time><span><b>${n}</b> <span class="${k}">${k==='l'?'ha perso':'ha vinto'}</span></span></li>`).join('');
}
/* ---- sicurezza: ogni modifica passa da una conferma ---- */
const $=id=>document.getElementById(id);
const banner=$('banner'),bText=$('b-text'),bOk=$('b-ok'),bNo=$('b-no');
let bTimer=null,bAction=null;
function closeBanner(){clearTimeout(bTimer);bAction=null;banner.hidden=true}
function openBanner({text,ok,tone='lose',action,secs=8}){
  clearTimeout(bTimer);bAction=action;
  bText.textContent=text;bOk.textContent=ok;bOk.className='btn '+tone;banner.hidden=false;
  bOk.focus({preventScroll:true});
  bTimer=setTimeout(closeBanner,secs*1000);
}
bOk.onclick=()=>{const a=bAction;closeBanner();if(a)a()};
bNo.onclick=closeBanner;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeBanner();closeModal()}});

$('board').addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(!b)return;
  const i=+b.dataset.i,k=b.dataset.k,name=S.p[i].n;
  openBanner({
    text:k==='l'?`Segnare una sconfitta a ${name}?`:`Segnare una vittoria a ${name}?`,
    ok:k==='l'?'Sì, ha perso':'Sì, ha vinto',tone:k==='l'?'lose':'win',
    action:()=>{S.p[i][k]++;S.log.unshift([name,k,new Date().toTimeString().slice(0,5)]);save();render()}
  });
});
$('undo').onclick=()=>{
  const x=S.log[0];if(!x)return;
  openBanner({text:`Togliere l'ultima mano? ${x[0]}: ${x[1]==='l'?'sconfitta':'vittoria'} delle ${x[2]}.`,ok:'Sì, togli',tone:'ghost',action:()=>{
    S.log.shift();const p=S.p.find(q=>q.n===x[0]);if(p&&p[x[1]]>0)p[x[1]]--;save();render();
  }});
};

/* azzeramento: finestra di avviso + pulsante da tenere premuto */
const modal=$('modal'),hold=$('hold');
const HOLD_MS=1800;let holdT=null,holdRaf=0,holdStart=0,lastFocus=null;
function closeModal(){if(modal.hidden)return;stopHold();modal.hidden=true;if(lastFocus)lastFocus.focus({preventScroll:true})}
function stopHold(){clearTimeout(holdT);cancelAnimationFrame(holdRaf);hold.style.setProperty('--p','0%');hold.classList.remove('holding')}
function startHold(){
  if(holdT)return;hold.classList.add('holding');holdStart=performance.now();
  const tick=()=>{const p=Math.min(1,(performance.now()-holdStart)/HOLD_MS);hold.style.setProperty('--p',p*100+'%');if(p<1)holdRaf=requestAnimationFrame(tick)};tick();
  holdT=setTimeout(()=>{holdT=null;doReset()},HOLD_MS);
}
function endHold(){clearTimeout(holdT);holdT=null;stopHold()}
function doReset(){
  const backup=JSON.stringify(S);
  S.p.forEach(p=>{p.l=0;p.w=0});S.log=[];save();render();stopHold();modal.hidden=true;
  openBanner({text:'Conteggi azzerati.',ok:'Ripristina',tone:'ghost',secs:12,action:()=>{S=JSON.parse(backup);save();render()}});
}
$('reset').onclick=()=>{
  const l=S.p.reduce((a,p)=>a+p.l,0),w=S.p.reduce((a,p)=>a+p.w,0);
  $('m-sum').textContent=l+w===0?'I conteggi sono già a zero.':`Si cancellano ${l} sconfitte, ${w} vittorie e tutto l'elenco delle mani.`;
  lastFocus=document.activeElement;closeBanner();modal.hidden=false;$('m-no').focus();
};
$('m-no').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
hold.addEventListener('pointerdown',e=>{e.preventDefault();startHold()});
['pointerup','pointerleave','pointercancel'].forEach(t=>hold.addEventListener(t,endHold));
hold.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();startHold()}});
hold.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')endHold()});
hold.addEventListener('contextmenu',e=>e.preventDefault());
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
